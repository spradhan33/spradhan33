</g>

<!-- RIGHT: focus -->
<g class="in" style="animation-delay:.15s"><circle cx="636" cy="66" r="3.5" fill="#FFFBF4"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" begin=".6s" repeatCount="indefinite"/></circle>
<text x="650" y="70" class="mono" font-size="11.5" fill="#D8CFBC" fill-opacity=".7" letter-spacing="2.4">// CURRENT FOCUS</text></g>
