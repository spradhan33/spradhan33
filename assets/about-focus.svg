<text x="696" y="200" font-size="12.5" fill="#D8CFBC" fill-opacity=".72">Core Java and object-oriented design</text>
<line x1="636" y1="211" x2="1128" y2="211" stroke="#565449" stroke-opacity=".45"/></g>
<g class="in" style="animation-delay:0.55s">
