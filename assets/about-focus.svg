<text x="696" y="254" font-size="12.5" fill="#D8CFBC" fill-opacity=".72">Neural networks in TensorFlow and Keras, focused on NLP</text>
<line x1="636" y1="265" x2="1128" y2="265" stroke="#565449" stroke-opacity=".45"/></g>
<g class="in" style="animation-delay:0.65s">
<text x="650" y="290" class="mono" font-size="12" fill="#D8CFBC" fill-opacity=".55" letter-spacing="1.5">04</text>
<text x="696" y="289" font-size="16.5" font-weight="600" fill="#FFFBF4">Generative AI</text>
<text x="696" y="308" font-size="12.5" fill="#D8CFBC" fill-opacity=".72">Prompt engineering, foundation models and generative workflows</text>
<line x1="636" y1="319" x2="1128" y2="319" stroke="#565449" stroke-opacity=".45"/></g>
