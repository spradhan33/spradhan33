<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">About Satyabrata Pradhan and current focus</title>
<desc id="d">Animated card: a short bio on the left and six current focus areas on the right, in smoky black, olive, bone and floral white.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#565449" stroke-opacity=".28" stroke-width="1"/></pattern>
<radialGradient id="halo" cx="20%" cy="0%" r="70%"><stop offset="0" stop-color="#565449" stop-opacity=".4"/><stop offset="1" stop-color="#565449" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1200" height="480" rx="20"/></clipPath>
</defs>
<style>
.serif{font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif}
.mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,monospace}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.mono,.serif{}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes draw{0%{stroke-dashoffset:1}60%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.curve{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.curve{animation:none;stroke-dashoffset:0}}
</style>
<g clip-path="url(#card)">
<rect width="1200" height="480" fill="#11120D"/>
<rect width="1200" height="480" fill="url(#halo)"><animate attributeName="opacity" values=".6;1;.6" dur="7s" repeatCount="indefinite"/></rect>
<rect width="1200" height="480" fill="url(#grid)"><animateTransform attributeName="transform" type="translate" values="0 0;32 32" dur="18s" repeatCount="indefinite"/></rect>
<line x1="600" y1="48" x2="600" y2="432" stroke="#565449" stroke-opacity=".7"/>

<!-- LEFT: about -->
<g class="in" style="animation-delay:.05s"><circle cx="76" cy="66" r="3.5" fill="#FFFBF4"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="90" y="70" class="mono" font-size="11.5" fill="#D8CFBC" fill-opacity=".7" letter-spacing="2.4">// ABOUT ME</text></g>
<g class="in serif" style="animation-delay:.2s"><text x="72" y="128" font-size="38" fill="#D8CFBC" letter-spacing="-.8" style="font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif">Learning by building.</text></g>
<g class="in" style="animation-delay:.4s" font-size="14.5" fill="#D8CFBC" fill-opacity=".86"><text x="72" y="176">4th-year B.Tech CSE student at Haldia Institute</text><text x="72" y="201">of Technology (graduating 2027), drawn to software</text><text x="72" y="226">engineering, machine learning and generative AI.</text><text x="72" y="251">I write clean, modular code in Java, Python, C,</text><text x="72" y="276">SQL and JavaScript, and I learn by building:</text><text x="72" y="301">projects, algorithm practice and deep learning.</text></g>

<g class="in mono" style="animation-delay:.7s" font-size="10.5" fill="#D8CFBC" letter-spacing="1.6">
<rect x="72" y="338" width="126" height="26" rx="13" fill="none" stroke="#565449" stroke-width="1.2"/><text x="90" y="355" textLength="90" lengthAdjust="spacing">B.TECH CSE</text>
</g>

<g class="in" style="animation-delay:.9s">
<text x="72" y="394" class="mono" font-size="9.5" fill="#D8CFBC" fill-opacity=".5" letter-spacing="2">// ACCURACY GAIN</text>
<line x1="72" y1="438" x2="492" y2="438" stroke="#565449" stroke-opacity=".8"/>
