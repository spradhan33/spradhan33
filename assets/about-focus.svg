<g class="in" style="animation-delay:0.35s">
<text x="650" y="128" class="mono" font-size="12" fill="#D8CFBC" fill-opacity=".55" letter-spacing="1.5">01</text>
<text x="696" y="127" font-size="16.5" font-weight="600" fill="#FFFBF4">Data Structures &amp; Algorithms</text>
<text x="696" y="146" font-size="12.5" fill="#D8CFBC" fill-opacity=".72">Algorithmic problem solving and optimization</text>
